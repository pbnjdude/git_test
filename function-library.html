<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Function library example</title>
  <style>
    input {
      font-size: 2em;
      margin: 10px 1px 0;
    }
  </style>
  </head>
<body>

  <input class="numberInput" type="text">
  <p></p>

  <script>
    const input = document.querySelector('.numberInput');
    const para = document.querySelector('p');

    input.addEventListener("change", () => {
      const num = parseFloat(input.value);
      if (isNaN(num)){
        para.textContent = "You need to enter a number!";
      }else{
        para.textContent = `${num} squared is ${squared(num)}. `;
        para.textContent += `${num} cubed is ${cubed(num)}. `;
        para.textContent += `${num} factorial is ${factorial(num)}. `;
        para.textContent += `${num} circumference is ${circumference(num)}. `;

      };
  
    });
    function squared(num){
      return num * num; 
    }

    function cubed(num){
      return num * num * num;
    }

    function factorial(num){
      if (num < 0) return undefined; 
      if (num === 0) return 1; 
      let x = num - 1; 
      while (x > 1) {
        num *= x; 
        x--;
      }
      return num; 
    }
    function circumference(num) {
      return (2*Math.PI)*num; 
    }

    function add7(num){
      return num + 7; 
    }

    function multiply(num1, num2){
      return num1 * num2; 
    }

    function capitalize(word){
      let lowercase = String(word).toLowerCase(); 
      lowercase = lowercase.charAt(0).toUpperCase() + lowercase.slice(1); 
      return String(lowercase);  
    }
    
    function lastLetter(word){
      return String(word).slice(word.length-1);
    }
    

  </script>
</body>
</html>
